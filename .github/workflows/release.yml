name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      # The exe looks for models\v6 next to itself, so both packages have to carry
      # them: without this the OCR and translate buttons are dead on a fresh machine.
      # DirectML.dll is the OCR GPU backend; ship it too.
      - name: Stage zip
        run: |
          $dir = "dist/Zshot-${{ github.ref_name }}"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item target/release/Zshot.exe $dir
          Copy-Item target/release/DirectML.dll $dir
          Copy-Item LICENSE $dir
          New-Item -ItemType Directory -Force "$dir/models/v6" | Out-Null
          Copy-Item models/v6/* "$dir/models/v6"
          Compress-Archive -Path $dir -DestinationPath "dist/Zshot-${{ github.ref_name }}-x64.zip"
      # Build the installer on the runner so every released artifact is
      # reproducible from the tagged commit (a SignPath requirement).
      - name: Install Inno Setup
        run: winget install --id JRSoftware.InnoSetup -e --silent --accept-source-agreements --accept-package-agreements
      - name: Locate ISCC
        run: |
          $iscc = Get-ChildItem "C:\Program Files*\Inno Setup 6\ISCC.exe", "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          if (-not $iscc) { throw "ISCC.exe not found" }
          echo "ISCC=$iscc" >> $env:GITHUB_ENV
      - name: Add Simplified Chinese installer language
        run: |
          $lang = Join-Path (Split-Path $env:ISCC -Parent) "Languages\ChineseSimplified.isl"
          Invoke-WebRequest "https://raw.githubusercontent.com/jrsoftware/issrc/is-6_7_3/Files/Languages/Unofficial/ChineseSimplified.isl" -OutFile $lang
      - name: Build installer
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          & $env:ISCC /DAppVersion=$ver installer\zshot.iss
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Zshot-${{ github.ref_name }}-x64.zip
            dist/Zshot-${{ github.ref_name }}-x64-setup.exe
